  name: kuberootmachinetemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: KuberootMachineTemplate
    listKind: KuberootMachineTemplateList
    plural: kuberootmachinetemplates
    singular: kuberootmachinetemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Template names are derived from their contents by the platform chart; an
              existing MachineSet must keep referencing the exact template it was given.
            properties:
              template:
                properties:
                  metadata:
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  spec:
                    properties:
                      cpus:
                        format: int32
                        minimum: 1
                        type: integer
                      disk:
                        properties:
                          image:
                            description: |-
                              Image written onto the disk when it is created: a URL of a qcow2 or
                              raw disk image that boots with UEFI.
                            type: string
                          size:
                            anyOf:
                            - type: integer
                            - type: string
                            default: 4Gi
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        required:
                        - image
                        type: object
                      maxCPUs:
                        format: int32
                        minimum: 1
                        type: integer
                      maxMemory:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      node:
                        description: Node is an optional placement constraint in the
                          infrastructure cluster.
                        type: string
                      providerID:
                        description: |-
                          ProviderID is set by this controller and copied to the CAPI Machine by
                          the CAPI core controller. It must match the workload Node's providerID.
                        type: string
                        x-kubernetes-validations:
                        - message: providerID is immutable
                          rule: self == oldSelf
                      replicas:
                        default: 3
                        enum:
                        - 1
                        - 3
                        format: int32
                        type: integer
                    required:
                    - cpus
                    - disk
                    - memory
                    type: object
                    x-kubernetes-validations:
                    - message: cpus exceeds maxCPUs
                      rule: '!has(self.maxCPUs) || self.cpus <= self.maxCPUs'
                    - message: memory exceeds maxMemory
                      rule: '!has(self.maxMemory) || quantity(string(self.memory)).compareTo(quantity(string(self.maxMemory)))
                        <= 0'
                    - message: memory must be positive
                      rule: quantity(string(self.memory)).compareTo(quantity('0'))
                        > 0
                    - message: memory and maxMemory must be multiples of 128Mi when
                        maxMemory is set
                      rule: '!has(self.maxMemory) || (quantity(string(self.memory)).isInteger()
                        && quantity(string(self.maxMemory)).isInteger() && quantity(string(self.memory)).asInteger()
                        % 134217728 == 0 && quantity(string(self.maxMemory)).asInteger()
                        % 134217728 == 0)'
                    - message: providerID cannot be removed or changed
                      rule: '!has(oldSelf.providerID) || (has(self.providerID) &&
                        self.providerID == oldSelf.providerID)'
                    - message: disk size must be positive
                      rule: quantity(string(self.disk.size)).compareTo(quantity('0'))
                        > 0
                required:
                - spec
                type: object
            required:
            - template
            type: object
            x-kubernetes-validations:
            - message: machine template spec is immutable; create a new template name
              rule: self == oldSelf
        required:
