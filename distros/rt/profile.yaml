# The rt distribution: a real-time controller. The kernel is fully
# preemptible (PREEMPT_RT); CPUs 0 and 1 keep the node's own work, its
# interrupts and RCU callbacks, and the CPUs past them run real-time work
# with no timer tick. The kubelet hands whole CPUs out of those to pods of the
# Guaranteed class that ask for whole CPUs, so a control loop in a pod has
# its CPUs to itself and may run at a real-time priority (SCHED_FIFO with
# CAP_SYS_NICE). The node API measures the latency the node delivers
# (latencytests). Needs four CPUs or more.
apiVersion: kuberoot.dev/v1alpha1
kind: Distribution
metadata:
  name: rt
spec:
  # Whole CPUs for Guaranteed pods that ask for whole CPUs, taken from the
  # CPUs past 0 and 1, which the node keeps; a pod gets physical cores, never
  # a thread sharing one with another pod.
  kubelet:
    cpuManagerPolicy: static
    cpuManagerPolicyOptions:
      full-pcpus-only: "true"
    reservedSystemCPUs: "0-1"
    # Memory of such pods from the NUMA node of their CPUs.
    memoryManagerPolicy: Static
    reservedMemory:
    - numaNode: 0
      limits:
        memory: 1124Mi
    kubeReserved:
      memory: 512Mi
    systemReserved:
      memory: 512Mi
    evictionHard:
      memory.available: 100Mi
    topologyManagerPolicy: single-numa-node
  sysctls:
    net.ipv4.ip_forward: "1"
    net.ipv6.conf.all.forwarding: "1"
    net.bridge.bridge-nf-call-iptables: "1"
    net.bridge.bridge-nf-call-ip6tables: "1"
    fs.inotify.max_user_instances: "8192"
    fs.inotify.max_user_watches: "524288"
    # Real-time tasks may take a CPU whole; the kernel's fair server keeps
    # the node's own work running beside them.
    kernel.sched_rt_runtime_us: "-1"
    # Timer migration and soft lockup checks wake CPUs of real-time work.
    kernel.timer_migration: "0"
    kernel.watchdog: "0"
  roles:
    controlPlane:
      generators: [node, cluster, etcd, containers, kubelet]
      addons: true
      packages: true
      services:
      - name: kuberoot-node
        args:
        - /usr/bin/kuberoot-node
        - --node-name={{.Node.Name}}
        - --advertise-address={{.Node.IP}}
        - --tls-cert-file={{pki "node-api.crt"}}
        - --tls-private-key-file={{pki "node-api.key"}}
        - --client-ca-file={{pki "node-client-ca.crt"}}
        - --kubeconfigs=admin={{kube "admin.kubeconfig"}}
        - --requestheader-client-ca-file={{pki "front-proxy-ca.crt"}}
        - --cluster-tls-cert-file={{pki "node-api-cluster.crt"}}
        - --cluster-tls-private-key-file={{pki "node-api-cluster.key"}}
        - --cluster-kubeconfig={{kube "node-api-delegation.kubeconfig"}}
        - --cluster-ca-file={{pki "ca.crt"}}
        - --cluster-ca-key-file={{pki "ca.key"}}
        - --admin-kubeconfig={{kube "admin.kubeconfig"}}
        - --proxy-client-cert-file={{pki "node-api-proxy.crt"}}
        - --proxy-client-key-file={{pki "node-api-proxy.key"}}
        - --routes-kubeconfig={{kube "admin.kubeconfig"}}
        - --pod-cidr={{.Net.Pod}}
        - --pod-network={{.Net.PodNetwork}}
        - --service-cidr={{.Net.Service}}
        - '{{if eq .Store.Kind "etcd"}}--etcd{{end}}'
        - --latency-tests
      - name: containerd
        args: [/usr/bin/containerd, --config, /etc/containerd/config.toml]
      - name: kine
        when: '{{eq .Store.Kind "kine"}}'
        args:
        - /usr/bin/kine
        - --endpoint
        # Writers wait for each other (busy timeout, transactions taking the
        # write lock up front, as k3s runs it) instead of failing with
        # "database is locked"; FULL sync keeps the state across power loss.
        - sqlite:///var/lib/kine/state.db?_journal=WAL&_synchronous=FULL&cache=shared&_busy_timeout=30000&_txlock=immediate
        - --listen-address
        - unix:///run/kine/kine.sock
        # The API server compacts the history every five minutes, as with etcd;
        # kine's own floor of 1000 revisions kept a quiet cluster's old
        # versions for hours, so list continuations never expired.
        - --compact-min-retain=100
      # etcd, on a control plane that others join: one member per control
      # plane, peers and clients authenticated with the store's own authority.
      - name: etcd
        when: '{{eq .Store.Kind "etcd"}}'
        args:
        - /usr/bin/etcd
        - --name={{.Etcd.Name}}
        - --data-dir=/var/lib/etcd
        - --listen-client-urls={{.Etcd.ClientURLs}}
        - --advertise-client-urls={{.Etcd.AdvertiseClientURL}}
        - --listen-peer-urls={{.Etcd.PeerURL}}
        - --initial-advertise-peer-urls={{.Etcd.PeerURL}}
        - --initial-cluster={{.Etcd.InitialCluster}}
        - --initial-cluster-state={{.Etcd.State}}
        - --cert-file={{pki "etcd-server.crt"}}
        - --key-file={{pki "etcd-server.key"}}
        - --client-cert-auth
        - --trusted-ca-file={{pki "etcd-ca.crt"}}
        - --peer-cert-file={{pki "etcd-peer.crt"}}
        - --peer-key-file={{pki "etcd-peer.key"}}
        - --peer-client-cert-auth
        - --peer-trusted-ca-file={{pki "etcd-ca.crt"}}
        - --listen-metrics-urls=http://127.0.0.1:2381
      - name: kube-apiserver
        args:
        - /usr/bin/kube-apiserver
        - --etcd-servers={{.Store.Servers}}
        - '{{if eq .Store.Kind "etcd"}}--etcd-cafile={{pki "etcd-ca.crt"}}{{end}}'
        - '{{if eq .Store.Kind "etcd"}}--etcd-certfile={{pki "apiserver-etcd-client.crt"}}{{end}}'
        - '{{if eq .Store.Kind "etcd"}}--etcd-keyfile={{pki "apiserver-etcd-client.key"}}{{end}}'
        - --advertise-address={{.Node.IP}}
        - --secure-port=6443
        - --service-cluster-ip-range={{.Net.Service}}
        - --client-ca-file={{pki "ca.crt"}}
        - --tls-cert-file={{pki "apiserver.crt"}}
        - --tls-private-key-file={{pki "apiserver.key"}}
        - --kubelet-client-certificate={{pki "apiserver-kubelet-client.crt"}}
        - --kubelet-client-key={{pki "apiserver-kubelet-client.key"}}
        - --kubelet-preferred-address-types=InternalIP
        - --kubelet-certificate-authority={{pki "ca.crt"}}
        - --service-account-issuer=https://kubernetes.default.svc.cluster.local
        - --service-account-key-file={{pki "sa.pub"}}
        - --service-account-signing-key-file={{pki "sa.key"}}
        - --authorization-mode=Node,RBAC
        - --enable-admission-plugins=NodeRestriction
        - --allow-privileged=true
        - --enable-bootstrap-token-auth=true
        - --admission-control-config-file={{kube "admission.yaml"}}
        - --encryption-provider-config={{pki "encryption.yaml"}}
        - --audit-policy-file={{kube "audit-policy.yaml"}}
        - --audit-log-path=/var/log/kuberoot/audit.log
        - --audit-log-maxsize=50
        - --audit-log-maxbackup=3
        # Aggregation: the node API joins the cluster API through the front proxy.
        - --requestheader-client-ca-file={{pki "front-proxy-ca.crt"}}
        - --requestheader-allowed-names=front-proxy-client
        - --requestheader-username-headers=X-Remote-User
        - --requestheader-group-headers=X-Remote-Group
        - --requestheader-extra-headers-prefix=X-Remote-Extra-
        - --proxy-client-cert-file={{pki "front-proxy-client.crt"}}
        - --proxy-client-key-file={{pki "front-proxy-client.key"}}
        - --enable-aggregator-routing=true
      - name: kube-controller-manager
        after: apiserver
        args:
        - /usr/bin/kube-controller-manager
        - --kubeconfig={{kube "controller-manager.kubeconfig"}}
        - --authentication-kubeconfig={{kube "controller-manager.kubeconfig"}}
        - --authorization-kubeconfig={{kube "controller-manager.kubeconfig"}}
        - --root-ca-file={{pki "ca.crt"}}
        - --service-account-private-key-file={{pki "sa.key"}}
        - --cluster-signing-cert-file={{pki "ca.crt"}}
        - --cluster-signing-key-file={{pki "ca.key"}}
        - --use-service-account-credentials=true
        - --controllers=*,bootstrapsigner,tokencleaner
        # Pod subnets are assigned here, not chosen by each node: routes to them
        # cannot be redirected by a node that lies about itself.
        - --allocate-node-cidrs=true
        - --cluster-cidr={{.Net.Pod}}
        - --node-cidr-mask-size=24
        - --service-cluster-ip-range={{.Net.Service}}
        - --leader-elect={{.Store.LeaderElect}}
      - name: kube-scheduler
        after: apiserver
        args:
        - /usr/bin/kube-scheduler
        - --kubeconfig={{kube "scheduler.kubeconfig"}}
        - --authentication-kubeconfig={{kube "scheduler.kubeconfig"}}
        - --authorization-kubeconfig={{kube "scheduler.kubeconfig"}}
        - --leader-elect={{.Store.LeaderElect}}
      - name: kubelet
        after: apiserver
        args:
        - /usr/bin/kubelet
        - --config={{kube "kubelet.yaml"}}
        - --kubeconfig={{kube "kubelet-client.kubeconfig"}}
        - --hostname-override={{.Node.Name}}
        - --node-ip={{.Node.IP}}
      - name: kube-proxy
        after: apiserver
        args:
        - /usr/bin/kube-proxy
        - --kubeconfig={{kube "kube-proxy.kubeconfig"}}
        - --proxy-mode=nftables
        - --cluster-cidr={{.Net.Pod}}
        - --hostname-override={{.Node.Name}}
      # Intents: lowers Apps to primitives and runs Overrides.
      - name: kuberoot-intents
        after: apiserver
        args: [/usr/bin/kuberoot-intents, '--kubeconfig={{kube "intents.kubeconfig"}}']
      # The package manager of the distribution: cluster add-ons are kubepkg packages.
      - name: kubepkg-operator
        after: apiserver
        env: [KUBECONFIG=/etc/kubernetes/admin.kubeconfig, HOME=/var/lib/kubepkg]
        args:
        - /usr/bin/kubepkg-operator
        - --backend=helm
        - --cache-dir=/var/lib/kubepkg/cache
        # What kuberoot nodes are like, for packages that need to know.
        - --values-secret=kube-system/kuberoot-platform-values
        # Credentials for private registries, when this Secret exists
        # (kubernetes.io/dockerconfigjson); without it, downloads go without.
        - --registry-secret=kube-system/kuberoot-registry-credentials
        # Pods in package namespaces run only the images their packages pin.
        - --image-policy=enforce
        - --webhook-namespace=kube-system
        - --webhook-service=kubepkg-webhook
        - --webhook-secret=kubepkg-webhook-tls
        - --webhook-config=kubepkg-images
        - --metrics-bind-address=0
        - --health-probe-bind-address=0
        # Several control planes run the operator; one of them acts.
        - '{{if eq .Store.Kind "etcd"}}--leader-elect{{end}}'
        - '{{if .Boot.RepoPlainHTTP}}--plain-http{{end}}'
    worker:
      generators: [node, member, containers, kubelet]
      services:
      - name: kuberoot-node
        args:
        - /usr/bin/kuberoot-node
        - --node-name={{.Node.Name}}
        - --advertise-address={{.Node.IP}}
        - --tls-cert-file={{pki "node-api.crt"}}
        - --tls-private-key-file={{pki "node-api.key"}}
        - --client-ca-file={{pki "node-client-ca.crt"}}
        - --cluster-tls-cert-file={{cluster "node-api.crt"}}
        - --cluster-tls-private-key-file={{cluster "node-api.key"}}
        - --proxy-trust-ca-file={{cluster "ca.crt"}}
        - --routes-kubeconfig=/var/lib/kubelet/kubeconfig
        # Several control planes: the cluster API, balanced on the node.
        - '{{if .Member.Servers}}--api-servers={{.Member.Servers}}{{end}}'
        - '{{if .Member.Servers}}--api-kubeconfig=/var/lib/kubelet/kubeconfig{{end}}'
        - --pod-cidr={{.Net.Pod}}
        - --pod-network={{.Net.PodNetwork}}
        - --latency-tests
      - name: containerd
        args: [/usr/bin/containerd, --config, /etc/containerd/config.toml]
      - name: kubelet
        args:
        - /usr/bin/kubelet
        - --config={{kube "kubelet.yaml"}}
        - --bootstrap-kubeconfig={{kube "bootstrap.kubeconfig"}}
        - --kubeconfig=/var/lib/kubelet/kubeconfig
        - --cert-dir=/var/lib/kubelet/pki
        - --hostname-override={{.Node.Name}}
        - --node-ip={{.Node.IP}}
      - name: kube-proxy
        after: kubelet-cert
        args:
        - /usr/bin/kube-proxy
        - --kubeconfig={{kube "kube-proxy.kubeconfig"}}
        - --proxy-mode=nftables
        - --cluster-cidr={{.Net.Pod}}
        - --hostname-override={{.Node.Name}}
