# Platform values: kubepkg layers them under the values of every package
# component (operator flag --values-secret). They describe what kuberoot
# nodes are like, for packages that need to know.
apiVersion: v1
kind: Secret
metadata:
  name: kuberoot-platform-values
  namespace: kube-system
stringData:
  values.yaml: |
    # LINSTOR/Piraeus: DRBD 9 is loaded at boot (and module loading then
    # disabled), there is no systemd, udev or D-Bus, and DRBD connects with
    # the node's addresses.
    linstorNode:
      drbdLoaded: true
      systemd: false
      hostNetwork: true

    # Memory requests, for components whose own are sized for server-class
    # nodes. A board has about 4 GiB left for pods once the node's services
    # and the guest pool are reserved, and the platform asked for 4.5 GiB
    # while using 2.1 GiB: the kubelet then turns pods away, or places and
    # evicts them, against memory that is in fact free.
    #
    # Only requests are lowered, never limits, so a component that needs more
    # under load still gets it; what changes is how much it reserves while
    # idle. Each figure is roughly twice what the component measured on a
    # running board. A key here reaches every component of every package, so
    # these are nested under names only one chart answers to.
    #
    # Two components are deliberately absent. cert-manager's cainjector asks
    # for 128Mi because its informer caches exceed that on a full install and
    # it is a single leader-elected replica, so stalling it stalls admission
    # for the whole cluster. The cilium agent measured more than it asks for
    # already.
    cilium:
      # A DaemonSet, so this is charged on every node. It idles at about
      # 40Mi; 512Mi came from the example in the upstream chart.
      envoy:
        resources:
          requests:
            memory: 128Mi
    cert-manager:
      resources:
        requests:
          memory: 80Mi
    reloader:
      reloader:
        deployment:
          resources:
            requests:
              memory: 64Mi
    # blockstor's REST front end, three active-active replicas.
    apiserver:
      resources:
        requests:
          memory: 64Mi
