---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: workspaces.workstation.kuberoot.dev
spec:
  group: workstation.kuberoot.dev
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    shortNames:
    - ws
    singular: workspace
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.node
      name: Node
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.rdp
      name: RDP
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Workspace is a person's desktop: a virtual machine with a desktop
          environment, whose disk the cluster replicates and which moves between
          nodes like any machine. The person opens it from a browser at status.url,
          or from an RDP client at status.rdp; the credentials are in the Secret
          status.credentials names.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              cpus:
                default: 2
                format: int32
                minimum: 1
                type: integer
              disk:
                anyOf:
                - type: integer
                - type: string
                default: 6Gi
                description: |-
                  Disk of the desktop, the person's files on it, kept on as many nodes
                  as Replicas.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              image:
                description: |-
                  Image is the desktop's disk image when it is first created: a cloud
                  image (qcow2 or raw, UEFI) of a distribution that runs cloud-init and
                  has packages for a desktop; Ubuntu 24.04 when unset.
                type: string
              memory:
                anyOf:
                - type: integer
                - type: string
                default: 2Gi
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              node:
                description: Node to run on; changed while it runs, the desktop moves
                  there alive.
                type: string
              owner:
                description: Owner is the person's user name in the desktop.
                pattern: ^[a-z_][a-z0-9_-]{0,31}$
                type: string
              replicas:
                default: 3
                enum:
                - 1
                - 3
                format: int32
                type: integer
              running:
                default: true
                description: 'Running: false shuts the desktop down and keeps its
                  disk.'
                type: boolean
            required:
            - owner
            type: object
          status:
            properties:
              address:
                type: string
              credentials:
                description: |-
                  Credentials names the Secret with the workspace's token and the
                  owner's password.
                type: string
              machine:
                description: Machine is the VirtualMachine the desktop runs in.
                type: string
              message:
                type: string
              node:
                type: string
              phase:
                description: |-
                  Phase: Pending, Provisioning (the desktop is being installed in the
                  machine), Ready, Stopped or Failed.
                type: string
              rdp:
                description: RDP is where an RDP client reaches the desktop.
                type: string
              rdpPort:
                description: RDPPort of the gateway, the workspace's own.
                format: int32
                type: integer
              url:
                description: URL opens the desktop in a browser; it carries the workspace's
                  token.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
