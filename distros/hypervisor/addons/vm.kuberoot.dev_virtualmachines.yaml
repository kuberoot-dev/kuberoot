---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: virtualmachines.vm.kuberoot.dev
spec:
  group: vm.kuberoot.dev
  names:
    kind: VirtualMachine
    listKind: VirtualMachineList
    plural: virtualmachines
    shortNames:
    - vm
    singular: virtualmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.running
      name: Running
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.node
      name: Node
      type: string
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.replicaNodes
      name: Replicas
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: VirtualMachine is a machine of the cluster, wherever it runs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              cpus:
                default: 1
                format: int32
                minimum: 1
                type: integer
              disk:
                properties:
                  image:
                    description: |-
                      Image written onto the disk when it is created: a URL of a qcow2 or
                      raw disk image that boots with UEFI.
                    type: string
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 4Gi
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - image
                type: object
              maxCPUs:
                description: |-
                  MaxCPUs is fixed at creation. Growth within it does not reboot the
                  guest; shrinking does. Omit it to restart on every CPU change.
                format: int32
                minimum: 1
                type: integer
              maxMemory:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  MaxMemory is fixed at creation and reserved in full on the host.
                  With it, memory and maxMemory use 128Mi steps. Growth is live;
                  shrinking restarts the guest. Omit it for restart-on-change behavior.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              memory:
                anyOf:
                - type: integer
                - type: string
                default: 512Mi
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              node:
                description: |-
                  Node to run on, among the replicas; any when unset. Changed while the
                  machine runs, the machine moves there alive.
                type: string
              replicas:
                default: 3
                description: |-
                  Replicas of the disk, on as many nodes: 3, so that the machine moves
                  when its node fails and two nodes keep the majority its disk needs to
                  be written; or 1, a disk on one node that stays with it.
                enum:
                - 1
                - 3
                format: int32
                type: integer
              running:
                default: true
                description: 'Running: the machine runs; false shuts it down and keeps
                  its disk.'
                type: boolean
              seedMode:
                description: |-
                  SeedMode selects the SMBIOS NoCloud protocol. Unset preserves the
                  original ds=nocloud serial. NoCloudNet uses ds=nocloud-net and serves
                  a MAC-specific DHCP network-config, required by Talos HTTP bootstrap.
                  It is fixed at creation, including whether the field is present.
                enum:
                - NoCloud
                - NoCloudNet
                type: string
              userData:
                description: |-
                  UserData is cloud-init's user data for the machine, a #cloud-config
                  document or a script, which the machines' gateway serves to it alone;
                  an image that runs cloud-init reads it at its first boot.
                type: string
              userDataSecret:
                description: |-
                  UserDataSecret names a Secret whose key userData holds the user data
                  instead, for user data with credentials in it.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - disk
            type: object
            x-kubernetes-validations:
            - message: maxCPUs must be at least cpus
              rule: '!has(self.maxCPUs) || self.maxCPUs >= self.cpus'
            - message: maxCPUs is immutable; create a new machine to change its ceiling
              rule: has(self.maxCPUs) == has(oldSelf.maxCPUs) && (!has(self.maxCPUs)
                || self.maxCPUs == oldSelf.maxCPUs)
            - message: maxMemory is immutable; create a new machine to change its
                ceiling
              rule: has(self.maxMemory) == has(oldSelf.maxMemory) && (!has(self.maxMemory)
                || quantity(string(self.maxMemory)).compareTo(quantity(string(oldSelf.maxMemory)))
                == 0)
            - message: maxMemory must be at least memory
              rule: '!has(self.maxMemory) || quantity(string(self.maxMemory)).compareTo(quantity(string(self.memory)))
                >= 0'
            - message: memory and maxMemory must be positive multiples of 128Mi when
                maxMemory is set
              rule: '!has(self.maxMemory) || (quantity(string(self.memory)).isInteger()
                && quantity(string(self.maxMemory)).isInteger() && quantity(string(self.memory)).asInteger()
                > 0 && quantity(string(self.memory)).asInteger() % 134217728 == 0
                && quantity(string(self.maxMemory)).asInteger() % 134217728 == 0)'
            - message: seedMode is immutable; create a new machine to change its bootstrap
                protocol
              rule: has(self.seedMode) == has(oldSelf.seedMode) && (!has(self.seedMode)
                || self.seedMode == oldSelf.seedMode)
          status:
            properties:
              address:
                type: string
              backendID:
                description: |-
                  BackendID binds this API object to the node Machine and Volume names.
                  Only the controller or the privileged migration tool writes it. New
                  objects use their UID; imports retain the old backend name.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: backendID is immutable
                  rule: self == oldSelf
              failedMigration:
                description: |-
                  FailedMigration names the node the last live move to failed for; it
                  is not tried again until spec.node changes.
                type: string
              imageWritten:
                description: 'ImageWritten: the disk holds its data; the image is
                  never written again.'
                type: boolean
              instanceID:
                description: |-
                  InstanceID is cloud-init's persistent guest identity. An imported VM
                  keeps its original UID even though recreating the API changes its UID.
                maxLength: 128
                minLength: 1
                pattern: ^[a-zA-Z0-9-]+$
                type: string
                x-kubernetes-validations:
                - message: instanceID is immutable
                  rule: self == oldSelf
              mac:
                description: MAC of its network interface, and the address it took.
                type: string
              message:
                type: string
              migration:
                description: Migration is the machine moving alive to another node.
                properties:
                  phase:
                    description: 'Phase: Preparing, Receiving, Sending.'
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                  target:
                    type: string
                required:
                - phase
                - startedAt
                - target
                type: object
              minor:
                description: Minor and Port of its replicated disk.
                format: int32
                type: integer
              moves:
                description: Moves counts the times the machine was started on another
                  node.
                format: int32
                type: integer
              node:
                description: Node the machine runs on, and the nodes holding its disk.
                type: string
              phase:
                description: 'Phase: Pending, Starting, Running, Stopped, Moving or
                  Failed.'
                type: string
              port:
                format: int32
                type: integer
              replicaAddresses:
                additionalProperties:
                  type: string
                description: |-
                  ReplicaAddresses are the replica nodes' addresses as last seen, for
                  the disk to keep its peers while a node is away.
                type: object
              replicaNodes:
                items:
                  type: string
                type: array
            type: object
            x-kubernetes-validations:
            - message: backendID cannot be removed or changed
              rule: '!has(oldSelf.backendID) || (has(self.backendID) && self.backendID
                == oldSelf.backendID)'
            - message: instanceID cannot be removed or changed
              rule: '!has(oldSelf.instanceID) || (has(self.instanceID) && self.instanceID
                == oldSelf.instanceID)'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: backendID cannot be removed, including by removing status
          rule: '!has(oldSelf.status) || !has(oldSelf.status.backendID) || (has(self.status)
            && has(self.status.backendID) && self.status.backendID == oldSelf.status.backendID)'
        - message: instanceID cannot be removed, including by removing status
          rule: '!has(oldSelf.status) || !has(oldSelf.status.instanceID) || (has(self.status)
            && has(self.status.instanceID) && self.status.instanceID == oldSelf.status.instanceID)'
    served: true
    storage: true
    subresources:
      status: {}
