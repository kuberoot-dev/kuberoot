---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: devices.devices.kuberoot.dev
spec:
  group: devices.kuberoot.dev
  names:
    kind: Device
    listKind: DeviceList
    plural: devices
    shortNames:
    - dev
    singular: device
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.protocol
      name: Protocol
      type: string
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .status.connected
      name: Connected
      type: boolean
    - jsonPath: .status.summary
      name: Values
      type: string
    - jsonPath: .status.error
      name: Error
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Device is a device the node reads: a PLC, a meter, a sensor, a server's
          BMC, a switch, a PDU, or a service it probes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              address:
                description: |-
                  Address of the device: host:port for modbus-tcp, snmp (port 161 when
                  left out) and tcp; the BMC's https://host for redfish; the URL for
                  http; the host for icmp.
                type: string
              credentials:
                description: |-
                  Credentials names a Secret with what the device asks for: username
                  and password for redfish; community for snmp version 2c; username,
                  and authProtocol (MD5, SHA, SHA256, SHA512), authPassword, privProtocol
                  (DES, AES, AES256) and privPassword as it needs them, for version 3.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              every:
                default: 1s
                description: Every is how often the device is read.
                type: string
              points:
                description: |-
                  Points are the values read from the device. A BMC and a probe report
                  theirs by themselves; points there only pick which to keep.
                items:
                  description: 'Point is a value of the device: where it is and how
                    to read it.'
                  properties:
                    kind:
                      default: holding
                      description: |-
                        Kind of Modbus table: holding or input registers, coils or discrete
                        inputs. Modbus only.
                      enum:
                      - holding
                      - input
                      - coil
                      - discrete
                      type: string
                    name:
                      description: 'Name of the value, as routes refer to it: a CEL
                        identifier.'
                      pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                      type: string
                    oid:
                      description: OID of an SNMP value, as 1.3.6.1.2.1.1.3.0.
                      pattern: ^\.?[0-9]+(\.[0-9]+)*$
                      type: string
                    register:
                      description: Register is the address in the Modbus table, counted
                        from 0.
                      format: int32
                      maximum: 65535
                      minimum: 0
                      type: integer
                    scale:
                      description: 'Scale multiplies the value read, as a decimal:
                        "0.1" for tenths.'
                      pattern: ^-?[0-9]+(\.[0-9]+)?$
                      type: string
                    type:
                      default: uint16
                      description: |-
                        Type of a Modbus value: 16-bit registers as they are, 32-bit ones from
                        two registers, the high word first; bool for coils and discrete
                        inputs. SNMP values carry their own types.
                      enum:
                      - int16
                      - uint16
                      - int32
                      - uint32
                      - float32
                      - bool
                      type: string
                    unit:
                      description: Unit of the value, for people.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              protocol:
                description: |-
                  Protocol the device speaks: modbus-tcp; snmp; redfish, a server's
                  BMC; or a probe of a service: http, tcp, icmp.
                enum:
                - modbus-tcp
                - snmp
                - redfish
                - http
                - tcp
                - icmp
                type: string
              snmp:
                description: SNMP settings.
                properties:
                  version:
                    default: 2c
                    enum:
                    - 2c
                    - "3"
                    type: string
                type: object
              timeout:
                default: 2s
                description: Timeout of one request.
                type: string
              tls:
                description: TLS for redfish and https probes.
                properties:
                  insecureSkipVerify:
                    description: |-
                      InsecureSkipVerify accepts any certificate: BMCs mostly have their
                      own, self-signed.
                    type: boolean
                type: object
              unitID:
                default: 1
                description: UnitID addresses a Modbus device behind a gateway; 1
                  when unset.
                format: int32
                maximum: 255
                minimum: 0
                type: integer
            required:
            - address
            - protocol
            type: object
            x-kubernetes-validations:
            - message: a Modbus device needs points
              rule: self.protocol != 'modbus-tcp' || (has(self.points) && size(self.points)
                > 0)
            - message: an SNMP device needs points with an oid
              rule: self.protocol != 'snmp' || (has(self.points) && size(self.points)
                > 0 && self.points.all(p, has(p.oid)))
          status:
            properties:
              conditions:
                description: 'Conditions: Applied says whether the node runs this
                  configuration.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connected:
                description: 'Connected: the last read of the device succeeded.'
                type: boolean
              error:
                type: string
              lastRead:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              summary:
                description: Summary of the values, for kubectl get.
                type: string
              values:
                description: Values as last read.
                items:
                  description: Value is a point as last read.
                  properties:
                    name:
                      type: string
                    unit:
                      type: string
                    value:
                      type: string
                  required:
                  - name
                  - value
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
