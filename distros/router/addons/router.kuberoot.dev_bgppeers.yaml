---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: bgppeers.router.kuberoot.dev
spec:
  group: router.kuberoot.dev
  names:
    kind: BGPPeer
    listKind: BGPPeerList
    plural: bgppeers
    singular: bgppeer
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .spec.asn
      name: ASN
      type: integer
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.routesReceived
      name: Received
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BGPPeer is a BGP session with a neighbour.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              address:
                type: string
              asn:
                format: int64
                maximum: 4294967294
                minimum: 1
                type: integer
              exportPolicy:
                description: |-
                  ExportPolicy restricts announced prefixes. Unset uses BGPRouter.announce;
                  an empty policy rejects all. This cannot enable transit export.
                properties:
                  prefixes:
                    items:
                      type: string
                    type: array
                type: object
              importPolicy:
                description: |-
                  ImportPolicy restricts accepted prefixes. Unset preserves BGPRouter.import;
                  an empty policy rejects all. Prefixes match exactly, never more specifics.
                properties:
                  prefixes:
                    items:
                      type: string
                    type: array
                type: object
              maxPrefixes:
                description: |-
                  MaxPrefixes disables the session when accepted prefixes exceed this limit.
                  Zero leaves the limit disabled. Reconfiguration resets the BIRD limit.
                format: int32
                maximum: 2147483647
                minimum: 0
                type: integer
              multihop:
                description: |-
                  Multihop allows the neighbour to be this many hops away; 0 for a
                  directly connected one.
                format: int32
                maximum: 255
                minimum: 0
                type: integer
            required:
            - address
            - asn
            type: object
          status:
            properties:
              conditions:
                description: 'Conditions: Applied says whether the node runs this
                  configuration.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the generation the conditions describe.
                format: int64
                type: integer
              routesReceived:
                format: int32
                type: integer
              since:
                description: Since is when the session entered its state.
                type: string
              state:
                description: 'State of the session: Established, Active, Connect,
                  Idle...'
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
