---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: bgprouters.router.kuberoot.dev
spec:
  group: router.kuberoot.dev
  names:
    kind: BGPRouter
    listKind: BGPRouterList
    plural: bgprouters
    singular: bgprouter
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.asn
      name: ASN
      type: integer
    - jsonPath: .spec.routerID
      name: Router ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Applied")].status
      name: Applied
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BGPRouter is the router's BGP speaker: its AS, its router ID and the
          networks it announces. There is one, named default.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              announce:
                description: Announce lists the networks the router announces to its
                  peers.
                items:
                  type: string
                type: array
              asn:
                format: int64
                maximum: 4294967294
                minimum: 1
                type: integer
              import:
                default: All
                description: |-
                  Import decides whether the routes peers announce go into the router's
                  routing table.
                enum:
                - All
                - None
                type: string
              routerID:
                description: RouterID, an IPv4 address; the router's first address
                  when unset.
                type: string
            required:
            - asn
            type: object
          status:
            description: BGPRouterStatus includes observed routes, not just the desired
              announcements.
            properties:
              conditions:
                description: 'Conditions: Applied says whether the node runs this
                  configuration.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the generation the conditions describe.
                format: int64
                type: integer
              routes:
                description: |-
                  Routes is a bounded snapshot of the kernel's main routing table,
                  refreshed with the BGP sessions. Protocol distinguishes routes from
                  kuberoot (107), BIRD and other writers. Multipath routes have one row
                  per next hop. At most 256 rows are reported.
                items:
                  description: KernelRoute is one observed route or next hop in the
                    main routing table.
                  properties:
                    destination:
                      type: string
                    gateway:
                      type: string
                    link:
                      type: string
                    metric:
                      format: int32
                      type: integer
                    protocol:
                      format: int32
                      type: integer
                    type:
                      format: int32
                      type: integer
                    weight:
                      description: Weight is the relative weight of a multipath next
                        hop.
                      format: int32
                      type: integer
                  required:
                  - destination
                  - metric
                  - protocol
                  - type
                  type: object
                type: array
              routesError:
                description: RoutesError explains a failed read; routes are cleared
                  on failure.
                type: string
              routesTruncated:
                type: boolean
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the BGP router is named default
          rule: self.metadata.name == 'default'
    served: true
    storage: true
    subresources:
      status: {}
