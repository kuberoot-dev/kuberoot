apiVersion: v1
kind: Pod
metadata:
  name: emulator-test
  namespace: tenant-kuberoot
  labels:
    app: kuberoot-emulator-test
spec:
  restartPolicy: Never
  containers:
  - name: qemu
    image: alpine:3.22
    command: [sh, -c, 'apk add --no-cache qemu-system-riscv64 curl python3 && sleep infinity']
    resources:
      requests: {cpu: "100m", memory: 1536Mi, ephemeral-storage: 1Gi}
      limits: {cpu: "100m", memory: 2Gi, ephemeral-storage: 2Gi}
    volumeMounts:
    - {name: data, mountPath: /data}
  volumes:
  - name: data
    emptyDir: {sizeLimit: 1Gi}
