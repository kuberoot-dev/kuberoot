apiVersion: v1
kind: Pod
metadata:
  name: slim-test
  namespace: tenant-kuberoot
  labels:
    app: kuberoot-slim-test
spec:
  restartPolicy: Never
  containers:
  - name: qemu
    image: alpine:3.22
    command: [sh, -c, 'apk add --no-cache qemu-system-riscv64 curl python3 && sleep infinity']
    resources:
      requests: {cpu: "2", memory: 2Gi, ephemeral-storage: 1Gi}
      limits: {cpu: "4", memory: 3Gi, ephemeral-storage: 2Gi}
    volumeMounts:
    - {name: data, mountPath: /data}
  volumes:
  - name: data
    emptyDir: {sizeLimit: 1500Mi}
